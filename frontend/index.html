<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Mi Lista de Tareas Pro</title>
  </head>
  <body>
       <div id="menu-principal" class="seccion-pantalla">
        <h1 class="titulo-app">🎙️ Hola Betty</h1>
        <div class="contenedor-botones-menu">
            <button class="boton-menu tareas" onclick="mostrarSeccion('seccion-tareas')">
                <span class="emoji">📝</span> Tareas de Hoy
            </button>
            <button class="boton-menu radios" onclick="mostrarSeccion('seccion-radios')">
                <span class="emoji">📻</span> Escuchar Radio
            </button>
            <button class="boton-menu familia" onclick="mostrarSeccion('seccion-familia')">
                <span class="emoji">👨‍👩‍👧‍👦</span> Ver Familia
            </button>
        </div>
    </div>

    <div id="seccion-tareas" class="seccion-pantalla" style="display: none;">
        <div class="cabecera-fija">
            <button class="btn-volver" onclick="mostrarSeccion('menu-principal')">⬅️ Volver</button>
            <input type="date" id="fecha-seleccionada" onchange="obtenerTareas()">
        </div>

        <div id="contenedor-editor" class="editor-magico" style="display: none;">
            <input type="text" id="titulo-tarea" placeholder="¿Qué vamos a hacer?">
            <div class="botones-fila">
                <button id="btn-voz" class="btn-accion voz">🎤 Dictar</button>
                <button onclick="guardarTareaManual()" class="btn-accion guardar">💾 Guardar</button>
            </div>
        </div>

        <button class="btn-nueva-tarea" onclick="document.getElementById('contenedor-editor').style.display='block'">+ Agregar Actividad</button>
        <div id="lista-tareas"></div>
    </div>

    <div id="seccion-radios" class="seccion-pantalla" style="display: none;">
        <button class="btn-volver" onclick="mostrarSeccion('menu-principal')">⬅️ Volver</button>
        <h2 class="subtitulo">Tus Radios Favoritas</h2>
        <div id="contenedor-radios-dinamico"></div>
    </div>

    <div id="seccion-familia" class="seccion-pantalla" style="display: none;">
        <button class="btn-volver" onclick="mostrarSeccion('menu-principal')">⬅️ Volver</button>
        <h2 class="subtitulo">Nuestra Familia</h2>
        <div id="grid-familia-vibrante"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
