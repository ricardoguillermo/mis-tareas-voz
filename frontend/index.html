<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Mi Lista de Tareas Pro</title>
  </head>
  <body>
    <div id="menu-principal" class="seccion">
        <h1>Mis Tareas</h1>
        <button onclick="mostrarSeccion('seccion-tareas')">Ir a Tareas</button>
        <button onclick="mostrarSeccion('seccion-radios')">Escuchar Radios</button>
    </div>

    <div id="seccion-tareas" class="seccion" style="display: none;">
        <button onclick="mostrarSeccion('menu-principal')">⬅️ Volver al Menú</button>
        
        <div id="contenedor-editor" class="editor-punteado" style="display: none;">
            <h3>Nueva Tarea</h3>
            <input type="text" id="titulo-tarea" placeholder="¿Qué hacemos?">
            <button onclick="guardarTarea()">Guardar</button>
        </div>

        <div class="controles-lista">
            <button onclick="document.getElementById('contenedor-editor').style.display='block'">+ Nueva Tarea</button>
            <input type="date" id="fecha-seleccionada" onchange="obtenerTareas()">
        </div>

        <div id="lista-tareas"></div>
    </div>

    <div id="seccion-radios" class="seccion" style="display: none;">
        <button onclick="mostrarSeccion('menu-principal')" class="btn-volver">⬅️ Volver al Menú</button>
        <h2>Radios para Betty</h2>
        
        <div class="contenedor-radios">
            <div class="tarjeta-radio">
                <div class="info-radio">
                    <span class="emoji-radio">📻</span>
                    <div>
                        <h3>Radio Clarín</h3>
                        <p>Tango y noticias</p>
                    </div>
                </div>
                <button class="btn-enlace" onclick="window.open('https://radioclarin.com.uy/', '_blank')">Escuchar Ahora</button>
            </div>

            <div class="tarjeta-radio">
                <div class="info-radio">
                    <span class="emoji-radio">🎵</span>
                    <div>
                        <h3>Radio Monte Carlo</h3>
                        <p>Música y compañía</p>
                    </div>
                </div>
                <button class="btn-enlace" onclick="window.open('https://www.radiomontecarlo.com.uy/', '_blank')">Escuchar Ahora</button>
            </div>

            <div class="tarjeta-radio">
                <div class="info-radio">
                    <span class="emoji-radio">🌟</span>
                    <div>
                        <h3>Radio Aspen</h3>
                        <p>Clásicos en inglés</p>
                    </div>
                </div>
                <button class="btn-enlace" onclick="window.open('https://fmaspen.com/', '_blank')">Escuchar Ahora</button>
            </div>

            <div class="tarjeta-radio">
                <div class="info-radio">
                    <span class="emoji-radio">⚽</span>
                    <div>
                        <h3>Radio Sport 890</h3>
                        <p>Deportes y fútbol</p>
                    </div>
                </div>
                <button class="btn-enlace" onclick="window.open('https://www.sport890.com.uy/', '_blank')">Escuchar Ahora</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
