<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Mi Lista de Tareas Pro</title>
  </head>
  <body>
    <div id="menu-principal" class="seccion">
      <h1>🎙️ Mis Tareas</h1>
      <div class="grid-container">
        <button
          class="boton-gigante"
          onclick="mostrarSeccion('seccion-tareas')"
        >
          <span>📝</span>
          <p>Tareas</p>
        </button>
        <button
          class="boton-gigante"
          onclick="mostrarSeccion('seccion-radios')"
        >
          <span>📻</span>
          <p>Radios</p>
        </button>
        <button
          class="boton-gigante"
          onclick="mostrarSeccion('seccion-familia')"
        >
          <span>👨‍👩‍👧‍👦</span>
          <p>Familia</p>
        </button>
      </div>
    </div>

    <div id="seccion-tareas" class="seccion" style="display: none">
      <button onclick="mostrarSeccion('menu-principal')">
        ⬅️ Volver al Menú
      </button>

      <div id="contenedor-editor" class="editor-punteado" style="display: none">
        <h3>Nueva Tarea</h3>
        <input type="text" id="titulo-tarea" placeholder="¿Qué hacemos?" />
        <button onclick="guardarTarea()">Guardar</button>
      </div>

      <div class="controles-lista">
        <button
          onclick="
            document.getElementById('contenedor-editor').style.display = 'block'
          "
        >
          + Nueva Tarea
        </button>
        <input type="date" id="fecha-seleccionada" onchange="obtenerTareas()" />
      </div>

      <div id="lista-tareas"></div>
    </div>

    <div id="seccion-radios" class="seccion" style="display: none">
      <button onclick="mostrarSeccion('menu-principal')" class="btn-volver">
        ⬅️ Volver al Menú
      </button>
      <h2>Radios para Betty</h2>

      <div class="contenedor-radios">
        <div class="tarjeta-radio">
          <div class="info-radio">
            <span class="emoji-radio">📻</span>
            <div>
              <h3>Radio Clarín</h3>
              <p>Tango y noticias</p>
            </div>
          </div>
          <button
            class="btn-enlace"
            onclick="window.open('https://radioclarin.com.uy/', '_blank')"
          >
            Escuchar Ahora
          </button>
        </div>

        <div class="tarjeta-radio">
          <div class="info-radio">
            <span class="emoji-radio">🎵</span>
            <div>
              <h3>Radio Monte Carlo</h3>
              <p>Música y compañía</p>
            </div>
          </div>
          <button
            class="btn-enlace"
            onclick="
              window.open('https://www.radiomontecarlo.com.uy/', '_blank')
            "
          >
            Escuchar Ahora
          </button>
        </div>

        <div class="tarjeta-radio">
          <div class="info-radio">
            <span class="emoji-radio">🌟</span>
            <div>
              <h3>Radio Aspen</h3>
              <p>Clásicos en inglés</p>
            </div>
          </div>
          <button
            class="btn-enlace"
            onclick="window.open('https://fmaspen.com/', '_blank')"
          >
            Escuchar Ahora
          </button>
        </div>

        <div class="tarjeta-radio">
          <div class="info-radio">
            <span class="emoji-radio">⚽</span>
            <div>
              <h3>Radio Sport 890</h3>
              <p>Deportes y fútbol</p>
            </div>
          </div>
          <button
            class="btn-enlace"
            onclick="window.open('https://www.sport890.com.uy/', '_blank')"
          >
            Escuchar Ahora
          </button>
        </div>
      </div>
    </div>
    <div id="seccion-familia" class="seccion" style="display: none">
      <button
        onclick="mostrarSeccion('menu-principal')"
        class="btn-volver-simple"
      >
        ⬅️ Volver
      </button>
      <h2>Nuestra Familia</h2>

      <div class="grid-familia">
        <div class="familiar-card">
          <img src="fotos/guillermo.jpg" alt="Guillermo" />
          <p>Guillermo</p>
          <button class="btn-audio" onclick="reproducirAudio('guillermo')">
            Escuchar 🔊
          </button>
        </div>

        <div class="familiar-card">
          <img src="fotos/diana.jpg" alt="Diana" />
          <p>Diana</p>
          <button class="btn-audio" onclick="reproducirAudio('diana')">
            Escuchar 🔊
          </button>
        </div>
        <div class="familiar-card">
          <img src="fotos/anibal.jpg" alt="Aníbal" />
          <p>Aníbal</p>
          <button class="btn-audio" onclick="reproducirAudio('anibal')">
            Escuchar 🔊
          </button>
        </div>

        <div class="familiar-card">
          <img src="fotos/agustina.jpg" alt="Agustina" />
          <p>Agustina</p>
          <button class="btn-audio" onclick="reproducirAudio('agustina')">
            Escuchar 🔊
          </button>
        </div>

        <div class="familiar-card">
          <img src="fotos/thiaguito.jpg" alt="Thiaguito" />
          <p>Thiaguito</p>
          <button class="btn-audio" onclick="reproducirAudio('thiaguito')">
            Escuchar 🔊
          </button>
        </div>

        <div class="familiar-card">
          <img src="fotos/brunita.jpg" alt="Brunita" />
          <p>Brunita</p>
          <button class="btn-audio" onclick="reproducirAudio('brunita')">
            Escuchar 🔊
          </button>
        </div>

        <div class="familiar-card">
          <img src="fotos/arturo.jpg" alt="Arturo" />
          <p>Arturo</p>
          <button class="btn-audio" onclick="reproducirAudio('arturo')">
            Escuchar 🔊
          </button>
        </div>

        
        <div class="familiar-card">
          <img src="fotos/maximo.jpg" alt="Máximo" />
          <p>Máximo</p>
          <button class="btn-audio" onclick="reproducirAudio('maximo')">
            Escuchar 🔊
          </button>
        </div>
        
        <div class="familiar-card">
          <img src="fotos/valentina.jpg" alt="Valentina" />
          <p>Valentina</p>
          <button class="btn-audio" onclick="reproducirAudio('valentina')">
            Escuchar 🔊
          </button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
